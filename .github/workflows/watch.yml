name: watch
on:
  schedule:
    - cron: '*/30 * * * *'   # safety net: keeps one run queued behind the active loop
  workflow_dispatch:
    inputs:
      loop_seconds:
        description: 'Loop duration in seconds (default 19800 = 5.5 h)'
        required: false
        default: '19800'
permissions:
  contents: write
  actions: write
concurrency:
  group: watch
  cancel-in-progress: false   # never kill the active loop; GitHub keeps max 1 pending run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # queued runs must start from the latest state, not the trigger SHA
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean up old runs (older than 24 h)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/actions/runs?status=completed&per_page=100" --paginate \
            --jq ".workflow_runs[] | select(.created_at < \"$cutoff\") | .id" |
          while read id; do gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" >/dev/null || true; done
      - name: Watch loop
        env:
          MATCH_CONFIG: ${{ secrets.MATCH_CONFIG }}
          WEBHOOK_URL: ${{ secrets.HEF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.HEF_WEBHOOK_KEY }}
          INTERVAL: '120'
          LOOP_SECONDS: ${{ github.event.inputs.loop_seconds || '19800' }}
        run: ./loop.sh
